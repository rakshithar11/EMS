{% extends "base.html" %}
{% block title %}Holidays · EMS{% endblock %}
{% block content %}<h1>Holiday Calendar</h1><section class="panel"><table><tr><th>Date</th><th>Day</th><th>Holiday</th><th>Type</th></tr>{% for h in holidays %}<tr><td>{{h.date}}</td><td>{{h.date.strftime('%A')}}</td><td>{{h.name}}</td><td><span class="badge">{{h.holiday_type}}</span></td></tr>{% endfor %}</table></section>{% endblock %}
